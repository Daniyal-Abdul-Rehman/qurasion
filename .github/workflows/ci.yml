name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: real_estate_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd apps/web && npm ci
        cd ../api && npm ci
        cd ../../packages/domain-types && npm ci
        cd ../financial-engine && npm ci

    - name: Run linting
      run: |
        cd apps/api && npm run lint
        cd apps/web && npm run lint

    - name: Run type checking
      run: |
        cd apps/api && npx tsc --noEmit
        cd apps/web && npx tsc --noEmit
        cd packages/domain-types && npx tsc --noEmit
        cd packages/financial-engine && npx tsc --noEmit

    - name: Run tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USERNAME: postgres
        DB_PASSWORD: postgres
        DB_DATABASE: real_estate_platform_test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        cd apps/api && npm test -- --coverage

    - name: Build packages
      run: |
        cd packages/domain-types && npm run build
        cd ../financial-engine && npm run build

    - name: Build applications
      run: |
        cd apps/api && npm run build
        cd ../web && npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run npm audit
      run: |
        npm audit --audit-level=moderate || true
        cd apps/web && npm audit --audit-level=moderate || true
        cd ../api && npm audit --audit-level=moderate || true
